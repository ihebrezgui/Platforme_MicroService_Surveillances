<div class="update-enseignant-container">
  <div class="header-section">
    <div class="header-content">
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="m18.5 2.5 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Modifier l'enseignant
      </h2>
      <p class="header-description">Mettez à jour les informations de l'enseignant</p>
    </div>
  </div>

  <div class="form-container">
    <form #updateForm="ngForm" (ngSubmit)="onSubmit(updateForm)" class="update-form" aria-label="Formulaire de mise à jour de l'enseignant">
      <div class="form-row">
        <div class="form-group">
          <label for="nom" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Nom complet
          </label>
          <input
            type="text"
            id="nom"
            name="nom"
            [(ngModel)]="enseignant.nom"
            required
            class="form-control"
            placeholder="Entrez le nom complet"
            aria-required="true"
            aria-label="Nom de l'enseignant"
          />
          <div *ngIf="updateForm.controls['nom']?.invalid && updateForm.controls['nom']?.touched" class="error-message">
            Le nom est requis
          </div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            Adresse email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="enseignant.email"
            required
            class="form-control"
            placeholder="exemple@email.com"
            aria-required="true"
            aria-label="Email de l'enseignant"
          />
          <div *ngIf="updateForm.controls['email']?.invalid && updateForm.controls['email']?.touched" class="error-message">
            Veuillez entrer une adresse email valide
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="telephone" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            Téléphone
          </label>
          <input
            type="text"
            id="telephone"
            name="telephone"
            [(ngModel)]="enseignant.telephone"
            required
            class="form-control"
            placeholder="Entrez le numéro de téléphone"
            aria-required="true"
            aria-label="Téléphone de l'enseignant"
          />
          <div *ngIf="updateForm.controls['telephone']?.invalid && updateForm.controls['telephone']?.touched" class="error-message">
            Le téléphone est requis
          </div>
        </div>

        <div class="form-group">
          <label for="matricule" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Matricule
          </label>
          <input
            type="text"
            id="matricule"
            name="matricule"
            [(ngModel)]="enseignant.matricule"
            required
            (input)="onMatriculeInput(enseignant.matricule)"
            class="form-control"
            placeholder="Entrez le matricule"
            aria-required="true"
            aria-label="Matricule de l'enseignant"
          />
          <div *ngIf="matriculeInvalide" class="error-message">
            Matricule invalide
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="grade" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            Grade
          </label>
          <select
            id="grade"
            name="grade"
            [(ngModel)]="enseignant.grade"
            required
            class="form-control form-select"
            aria-required="true"
            aria-label="Grade de l'enseignant"
          >
            <option [ngValue]="null" disabled>Sélectionnez un grade</option>
            <option *ngFor="let grade of gradeOptions" [value]="grade">{{ grade }}</option>
          </select>
          <div *ngIf="updateForm.controls['grade']?.invalid && updateForm.controls['grade']?.touched" class="error-message">
            Veuillez sélectionner un grade
          </div>
        </div>

        <div class="form-group">
          <label for="statut" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4"/>
              <path d="M21 12c-1 0-2-1-2-2s1-2 2-2 2 1 2 2-1 2-2 2z"/>
              <path d="M3 12c1 0 2-1 2-2s-1-2-2-2-2 1-2 2 1 2 2 2z"/>
            </svg>
            Statut
          </label>
          <select
            id="statut"
            name="statut"
            [(ngModel)]="enseignant.statut"
            required
            class="form-control form-select"
            aria-required="true"
            aria-label="Statut de l'enseignant"
          >
            <option [ngValue]="null" disabled>Sélectionnez un statut</option>
            <option *ngFor="let statut of statutOptions" [value]="statut">
              {{ statut === 'PERMANENT' ? 'Permanent' : 'Vacataire' }}
            </option>
          </select>
          <div *ngIf="updateForm.controls['statut']?.invalid && updateForm.controls['statut']?.touched" class="error-message">
            Veuillez sélectionner un statut
          </div>
        </div>

        <div class="form-group">
          <label for="unitePedagogique" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10,9 9,9 8,9"/>
            </svg>
            Unité Pédagogique
          </label>
          <select
            id="unitePedagogique"
            name="unitePedagogique"
            [(ngModel)]="selectedUnitePedagogiqueId"
            (change)="onUniteChange($event)"
            required
            class="form-control form-select"
            aria-required="true"
            aria-label="Unité Pédagogique de l'enseignant"
          >
            <option [value]="0" disabled>Sélectionnez une unité</option>
            <option *ngFor="let up of unitePedagogiques" [value]="up?.id ?? 0">
              {{ up?.libelle ?? '—' }}
            </option>
          </select>
          <div *ngIf="updateForm.controls['unitePedagogique']?.invalid && updateForm.controls['unitePedagogique']?.touched" class="error-message">
            Veuillez sélectionner une unité pédagogique
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="navigateToEnseignants()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12,19 5,12 12,5"/>
          </svg>
          Annuler
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="updateForm.invalid || matriculeInvalide || isSubmitting"
          aria-label="Mettre à jour l'enseignant"
        >
          <svg *ngIf="!isSubmitting" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22,4 12,14.01 9,11.01"/>
          </svg>
          <div *ngIf="isSubmitting" class="spinner"></div>
          {{ isSubmitting ? 'Modification...' : 'Modifier l\'enseignant' }}
        </button>
      </div>
    </form>
  </div>
</div>

<div class="container">
  <div class="left-section">
    <div class="logo-container">
      <img src="assets/img/logo.png" alt="ESPRIT" class="logo-img" />
    </div>

    <div class="title-container">
      <h1 class="app-title">GestionSurveillance</h1>
      <p class="app-subtitle">ESPRIT</p>
    </div>
  </div>

  <div class="right-section">
    <!-- Success/Error Messages -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="toggle-section">
      <div class="toggle-option">
        <input 
          type="radio" 
          id="user" 
          name="formType" 
          value="user" 
          [checked]="!isAddingTeacher"
          (change)="onToggleForm('user')"
        />
        <label for="user" class="toggle-label">👤 Ajouter Utilisateur</label>
      </div>
      <div class="toggle-option">
        <input 
          type="radio" 
          id="teacher" 
          name="formType" 
          value="teacher"
          [checked]="isAddingTeacher"
          (change)="onToggleForm('teacher')"
        />
        <label for="teacher" class="toggle-label">🎓 Ajouter Enseignant</label>
      </div>
      <div class="toggle-slider" [class.teacher]="isAddingTeacher"></div>
    </div>

    <!-- User Form -->
    <div *ngIf="!isAddingTeacher" class="auth-section">
      <h2 class="section-title">Inscription Utilisateur</h2>
      <form [formGroup]="userForm" (ngSubmit)="onSubmitUser()">
        <div class="form-group">
          <input 
            type="text" 
            class="form-control" 
            formControlName="username" 
            placeholder="Nom d'utilisateur *"
          />
        </div>
        
        <div class="form-group">
          <input 
            type="text" 
            class="form-control" 
            formControlName="matricule" 
            placeholder="Matricule *"
          />
        </div>

        <div class="form-group">
          <input 
            type="email" 
            class="form-control" 
            formControlName="email" 
            placeholder="Adresse e-mail *"
          />
        </div>

        <div class="form-group">
          <input 
            type="password" 
            class="form-control" 
            formControlName="password" 
            placeholder="Mot de passe *"
          />
        </div>
        
        <div class="form-group">
          <select class="form-control" formControlName="role">
            <option value="SUPER_ADMIN">Super-Administrateur</option>
            <option value="ADMIN">Administrateur</option>
            
          </select>
        </div>
        
        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="userForm.invalid || isSubmittingUser"
        >
          <span *ngIf="!isSubmittingUser">Créer l'utilisateur</span>
          <span *ngIf="isSubmittingUser">Création en cours...</span>
        </button>
      </form>
    </div>

    <!-- Teacher Form -->
    <div *ngIf="isAddingTeacher" class="auth-section">
      <h2 class="section-title">Inscription Enseignant</h2>
      <form [formGroup]="enseignantForm" (ngSubmit)="onSubmitEnseignant()">
        <div class="form-group">
          <input 
            type="text" 
            class="form-control" 
            formControlName="username" 
            placeholder="Nom d'utilisateur *"
          />
        </div>

        <div class="form-group">
          <input 
            type="text" 
            class="form-control" 
            formControlName="matricule" 
            placeholder="Matricule *"
          />
        </div>

        <div class="form-group">
          <input 
            type="email" 
            class="form-control" 
            formControlName="email" 
            placeholder="Adresse e-mail *"
          />
        </div>

        <div class="form-group">
          <input 
            type="password" 
            class="form-control" 
            formControlName="password" 
            placeholder="Mot de passe *"
          />
        </div>

        <div class="form-group">
          <input 
            type="tel" 
            class="form-control" 
            formControlName="telephone" 
            placeholder="Téléphone *"
          />
        </div>

        <div class="form-group">
          <div class="grade-options">
            <div class="grade-option">
              <input type="radio" id="cup" formControlName="grade" value="CUP" />
              <label for="cup">CUP</label>
            </div>
            <div class="grade-option">
              <input type="radio" id="efa" formControlName="grade" value="EFA" />
              <label for="efa">EFA</label>
            </div>
            <div class="grade-option">
              <input type="radio" id="ef" formControlName="grade" value="EF" />
              <label for="ef">EF</label>
            </div>
            <div class="grade-option">
              <input type="radio" id="chefdep" formControlName="grade" value="CHEFDEP" />
              <label for="chefdep">CHEFDEP</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="statut-options">
            <div class="statut-option">
              <input type="radio" id="permanent" formControlName="statut" value="PERMANENT" />
              <label for="permanent">PERMANENT</label>
            </div>
            <div class="statut-option">
              <input type="radio" id="vacataire" formControlName="statut" value="VACATAIRE" />
              <label for="vacataire">VACATAIRE</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <select class="form-control" formControlName="unitePedagogiqueId">
            <option value="">-- Sélectionnez une unité --</option>
            <option *ngFor="let up of unitePedagogiques" [value]="up.id">{{ up.libelle }}</option>
          </select>
        </div>

        <button 
          type="submit" 
          class="btn btn-primary" 
          [disabled]="enseignantForm.invalid || isSubmittingTeacher"
        >
          <span *ngIf="!isSubmittingTeacher">Créer l'enseignant</span>
          <span *ngIf="isSubmittingTeacher">Création en cours...</span>
        </button>
      </form>
    </div>
  </div>
</div>
